<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Karya & Sertifikat | Wahyu Hidayat Portofolio v7</title>

    <link rel="icon" type="image/png" href="Image/logo%20white.png?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-[#120204] text-white selection:bg-[#ff3b00] selection:text-white antialiased min-h-screen flex flex-col justify-between">

    <!-- 1. TOP HEADER NAVBAR -->
    <header class="w-full fixed top-0 left-0 right-0 z-40 header-dark py-2.5 sm:py-3.5 px-3 sm:px-8 md:px-12 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
            <a href="index.html" class="flex items-center gap-2 text-white group shrink-0">
                <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-white/10 border border-white/20 text-white flex items-center justify-center font-bold text-xs sm:text-sm group-hover:bg-[#ff3b00] transition-all">
                    W
                </div>
                <span id="brand-name" class="font-agency-thin text-sm sm:text-base tracking-tight text-white font-light">Whyuhdyat.</span>
            </a>

            <!-- Back Button (Fully Responsive on Mobile) -->
            <a id="btn-back-link" href="index.html" class="bg-white/10 hover:bg-[#ff3b00] text-white text-[10px] sm:text-xs font-bold px-3 py-1.5 sm:px-4 sm:py-2 rounded-full border border-white/20 transition-all flex items-center gap-1.5 shadow-md shrink-0">
                <i class="fa-solid fa-arrow-left text-[10px] sm:text-xs"></i> <span>Kembali</span>
            </a>
        </div>
    </header>

    <!-- 2. MAIN DETAIL CONTENT CONTAINER -->
    <main class="pt-20 sm:pt-28 pb-12 sm:pb-20 max-w-7xl mx-auto px-3 sm:px-6 md:px-12 w-full flex-grow">
        <div id="detail-container" class="space-y-8 sm:space-y-12">
            <!-- Dynamic Content Will Be Injected Here via JavaScript -->
            <div class="text-center py-16 sm:py-20 text-slate-400 space-y-3">
                <i class="fa-solid fa-spinner fa-spin text-2xl sm:text-3xl text-[#ff3b00]"></i>
                <p class="text-xs sm:text-sm font-semibold">Memuat rincian detail...</p>
            </div>
        </div>
    </main>

    <!-- 3. DARK FOOTER -->
    <footer class="bg-[#0d0203] text-white py-6 sm:py-8 border-t border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-12 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4 text-center sm:text-left">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-[#ff3b00] text-white flex items-center justify-center text-xs sm:text-sm font-bold shadow-lg">
                    W
                </div>
                <span class="font-agency-thin text-sm sm:text-base uppercase text-white">Wahyu Hidayat Portofolio v7</span>
            </div>
            <p class="text-[10px] sm:text-xs text-slate-500">© 2026 Wahyu Hidayat. All rights reserved.</p>
        </div>
    </footer>

    <!-- Core App Engine Script -->
    <script src="./js/app.js"></script>

    <!-- Detail Rendering Engine Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const container = document.getElementById("detail-container");
            const backBtnLink = document.getElementById("btn-back-link");

            // Parse URL Query Params
            const params = new URLSearchParams(window.location.search);
            const type = params.get("type"); // 'project' or 'cert'
            const id = parseInt(params.get("id"));

            // Fetch stored data
            const data = (typeof getPortfolioData === "function") ? getPortfolioData() : null;

            if (!data || isNaN(id)) {
                renderError("Parameter detail tidak ditemukan.");
                return;
            }

            if (type === "cert") {
                renderCertDetail(data.certifications || [], id);
                if (backBtnLink) backBtnLink.href = "index.html#education";
            } else {
                renderProjectDetail(data.projects || [], id);
                if (backBtnLink) backBtnLink.href = "index.html#projects";
            }

            function renderError(msg) {
                container.innerHTML = `
                    <div class="bg-[#141416] border border-rose-500/40 rounded-2xl sm:rounded-3xl p-6 sm:p-8 text-center max-w-xl mx-auto space-y-4 my-8 sm:my-12">
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-rose-500/20 text-rose-500 flex items-center justify-center text-xl sm:text-2xl mx-auto">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h2 class="font-agency-thin text-xl sm:text-2xl text-white">Detail Tidak Ditemukan</h2>
                        <p class="text-xs text-slate-400 leading-relaxed">${escapeHtml(msg)}</p>
                        <a href="index.html" class="inline-flex items-center gap-2 btn-pill-red text-xs px-4 py-2">
                            <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
                        </a>
                    </div>
                `;
            }

            function renderProjectDetail(projects, projId) {
                const projIndex = projects.findIndex(p => parseInt(p.id) === projId);
                const proj = projects[projIndex];

                if (!proj) {
                    renderError("Data proyek tidak ditemukan.");
                    return;
                }

                document.title = `${proj.title} | Detail Proyek Portofolio v7`;

                const prevProj = projects[projIndex - 1];
                const nextProj = projects[projIndex + 1];

                const fullDesc = proj.fullDescription || proj.description || "Belum ada rincian deskripsi tambahan untuk proyek ini.";
                const keyFeatures = proj.features || [
                    "Arsitektur responsif berkecepatan tinggi.",
                    "Antarmuka pengguna presisi dengan animasi modern.",
                    "Integrasi API & manajemen data scalable.",
                    "Dioptimalkan untuk performa SEO & aksesibilitas."
                ];

                container.innerHTML = `
                    <!-- Hero Header -->
                    <div class="space-y-3 sm:space-y-4 pt-2 sm:pt-4 border-b border-white/10 pb-5 sm:pb-8">
                        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                            <span class="bg-[#ff3b00] text-white text-[8px] sm:text-[10px] font-extrabold uppercase px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full tracking-widest shadow-md">
                                ${escapeHtml(proj.category || 'Web Project')}
                            </span>
                            <span class="text-[10px] sm:text-xs text-slate-400 font-medium">Studi Kasus Proyek</span>
                        </div>

                        <h1 class="font-agency-thin text-2xl sm:text-5xl md:text-6xl text-white uppercase leading-[0.92] tracking-[-0.03em] break-words">
                            ${escapeHtml(proj.title)}
                        </h1>

                        <p class="text-xs sm:text-base text-slate-300 max-w-3xl leading-relaxed font-normal pt-0.5 sm:pt-1">
                            ${escapeHtml(proj.description || '')}
                        </p>
                    </div>

                    <!-- Main Showcase Banner Media (Image or Video) -->
                    <div class="rounded-2xl sm:rounded-3xl overflow-hidden border border-white/15 bg-black/60 shadow-2xl relative h-48 sm:h-[380px] md:h-[480px]">
                        ${(proj.image && (proj.image.toLowerCase().endsWith('.mp4') || proj.image.toLowerCase().endsWith('.webm'))) 
                            ? `<video src="${escapeHtml(proj.image)}" autoplay muted loop controls playsinline class="w-full h-full object-cover" style="object-position: top center;"></video>` 
                            : `<img src="${escapeHtml(proj.image || './assets/foto.png')}" alt="${escapeHtml(proj.title)}" class="w-full h-full object-cover" onerror="this.src='./assets/foto.png'">`
                        }
                    </div>

                    <!-- Two-Column Grid: Left Full Description vs Right Specs -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8 lg:gap-12 pt-2 sm:pt-4">
                        
                        <!-- Left Main Description -->
                        <div class="lg:col-span-7 space-y-6 sm:space-y-8">
                            <div class="space-y-2.5 sm:space-y-4">
                                <h3 class="font-agency-thin text-xl sm:text-2xl text-white uppercase">Gambaran Umum & Solusi</h3>
                                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal whitespace-pre-line">
                                    ${escapeHtml(fullDesc)}
                                </p>
                            </div>

                            <!-- Key Features Checklist -->
                            <div class="bg-[#141416] border border-white/10 rounded-2xl sm:rounded-3xl p-4 sm:p-6 space-y-3 sm:space-y-4 shadow-xl">
                                <h4 class="font-agency-thin text-base sm:text-lg text-white uppercase flex items-center gap-2">
                                    <i class="fa-solid fa-star text-[#ff3b00] text-xs sm:text-sm"></i> Keunggulan Utama Sistem
                                </h4>
                                <ul class="space-y-2 sm:space-y-2.5">
                                    ${keyFeatures.map(feat => `
                                        <li class="flex items-start gap-2 sm:gap-2.5 text-xs text-slate-300 font-medium">
                                            <i class="fa-solid fa-circle-check text-[#ff3b00] text-xs sm:text-sm shrink-0 mt-0.5"></i>
                                            <span>${escapeHtml(feat)}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>

                        <!-- Right Tech Specs & Action Links -->
                        <div class="lg:col-span-5 space-y-4 sm:space-y-6">
                            
                            <!-- Tech Stack Box -->
                            <div class="bg-[#141416] border border-[#ff3b00]/30 rounded-2xl sm:rounded-3xl p-4 sm:p-6 space-y-3 sm:space-y-4 shadow-xl">
                                <span class="text-[9px] sm:text-[10px] font-extrabold uppercase tracking-widest text-[#ff3b00] block">TEKNOLOGI DIGUNAKAN</span>
                                <div class="flex flex-wrap gap-1.5 sm:gap-2">
                                    ${(proj.tags || []).map(tag => `
                                        <span class="bg-white/10 border border-white/20 text-white text-[10px] sm:text-xs font-bold px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full flex items-center gap-1.5">
                                            <i class="fa-solid fa-code text-[#ff3b00] text-[9px] sm:text-[10px]"></i> ${escapeHtml(tag)}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="bg-[#1c0508] border border-white/10 rounded-2xl sm:rounded-3xl p-4 sm:p-6 space-y-2.5 sm:space-y-3 shadow-xl">
                                <span class="text-[9px] sm:text-[10px] font-extrabold uppercase tracking-widest text-slate-400 block mb-1 sm:mb-2">AKSI & SKRIP KODE</span>
                                
                                ${proj.demoUrl ? `
                                    <a href="${escapeHtml(proj.demoUrl)}" target="_blank" class="btn-pill-red w-full justify-center text-xs py-2.5 sm:py-3 font-bold flex items-center gap-2">
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Kunjungi Live Demo Web
                                    </a>
                                ` : ''}

                                ${proj.repoUrl ? `
                                    <a href="${escapeHtml(proj.repoUrl)}" target="_blank" class="btn-pill-white w-full justify-center text-xs py-2.5 sm:py-3 font-bold flex items-center gap-2">
                                        <i class="fa-brands fa-github text-sm sm:text-base"></i> Lihat Repositori GitHub
                                    </a>
                                ` : ''}

                                <a href="index.html#contact" class="btn-pill-outline w-full justify-center text-xs py-2 sm:py-2.5 font-bold flex items-center gap-2">
                                    <i class="fa-solid fa-comments"></i> Konsultasi Proyek Serupa
                                </a>
                            </div>

                        </div>
                    </div>

                    <!-- Next & Prev Navigation -->
                    <div class="flex items-center justify-between border-t border-white/10 pt-6 sm:pt-8 gap-2 sm:gap-4">
                        ${prevProj ? `
                            <a href="detail.html?type=project&id=${prevProj.id}" class="group flex items-center gap-2 sm:gap-3 text-slate-400 hover:text-white transition-all max-w-[48%]">
                                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-white/10 group-hover:bg-[#ff3b00] group-hover:text-white flex items-center justify-center text-xs shrink-0 transition-all">
                                    <i class="fa-solid fa-arrow-left"></i>
                                </div>
                                <div class="overflow-hidden">
                                    <span class="text-[8px] sm:text-[9px] font-extrabold uppercase tracking-widest text-slate-500 block truncate">PROYEK SEBELUMNYA</span>
                                    <span class="text-[10px] sm:text-xs font-bold text-slate-200 truncate block">${escapeHtml(prevProj.title)}</span>
                                </div>
                            </a>
                        ` : `<div></div>`}

                        ${nextProj ? `
                            <a href="detail.html?type=project&id=${nextProj.id}" class="group flex items-center gap-2 sm:gap-3 text-slate-400 hover:text-white transition-all text-right max-w-[48%] ml-auto">
                                <div class="overflow-hidden">
                                    <span class="text-[8px] sm:text-[9px] font-extrabold uppercase tracking-widest text-slate-500 block truncate">PROYEK SELANJUTNYA</span>
                                    <span class="text-[10px] sm:text-xs font-bold text-slate-200 truncate block">${escapeHtml(nextProj.title)}</span>
                                </div>
                                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-white/10 group-hover:bg-[#ff3b00] group-hover:text-white flex items-center justify-center text-xs shrink-0 transition-all">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </a>
                        ` : `<div></div>`}
                    </div>
                `;
            }

            function renderCertDetail(certs, certId) {
                const certIndex = certs.findIndex(c => parseInt(c.id) === certId);
                const cert = certs[certIndex];

                if (!cert) {
                    renderError("Data sertifikasi tidak ditemukan.");
                    return;
                }

                document.title = `${cert.title} | Detail Sertifikat Portofolio v7`;

                const prevCert = certs[certIndex - 1];
                const nextCert = certs[certIndex + 1];

                const fullDesc = cert.fullDescription || cert.description || `Sertifikasi resmi "${cert.title}" yang diterbitkan oleh ${cert.issuer} pada tahun ${cert.year}. Lisensi ini memvalidasi keahlian teknis dan standar profesional di industri digital.`;

                container.innerHTML = `
                    <!-- Hero Header -->
                    <div class="space-y-3 sm:space-y-4 pt-2 sm:pt-4 border-b border-white/10 pb-5 sm:pb-8">
                        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                            <span class="bg-[#ff3b00] text-white text-[8px] sm:text-[10px] font-extrabold uppercase px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full tracking-widest shadow-md">
                                SERTIFIKASI & LISENSI
                            </span>
                            <span class="text-[10px] sm:text-xs text-slate-400 font-medium">Tahun Penerbitan: ${escapeHtml(cert.year)}</span>
                        </div>

                        <h1 class="font-agency-thin text-2xl sm:text-5xl md:text-6xl text-white uppercase leading-[0.92] tracking-[-0.03em] break-words">
                            ${escapeHtml(cert.title)}
                        </h1>

                        <p class="text-xs sm:text-base text-slate-300 max-w-3xl leading-relaxed font-bold text-[#ff3b00]">
                            Penerbit Resmi: ${escapeHtml(cert.issuer)}
                        </p>
                    </div>

                    <!-- Full Certificate Image Banner (Responsive Height) -->
                    <div class="rounded-2xl sm:rounded-3xl overflow-hidden border border-white/15 bg-black/60 shadow-2xl relative h-48 sm:h-[380px] md:h-[480px]">
                        <img src="${escapeHtml(cert.image || './assets/foto.png')}" alt="${escapeHtml(cert.title)}" class="w-full h-full object-contain p-2 sm:p-4" onerror="this.src='./assets/foto.png'">
                    </div>

                    <!-- Details Grid -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8 lg:gap-12 pt-2 sm:pt-4">
                        <div class="lg:col-span-7 space-y-4 sm:space-y-6">
                            <h3 class="font-agency-thin text-xl sm:text-2xl text-white uppercase">Cakupan Kompetensi & Validasi</h3>
                            <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal whitespace-pre-line">
                                ${escapeHtml(fullDesc)}
                            </p>
                        </div>

                        <div class="lg:col-span-5 bg-[#141416] border border-[#ff3b00]/30 rounded-2xl sm:rounded-3xl p-4 sm:p-6 space-y-3 sm:space-y-4 shadow-xl self-start">
                            <span class="text-[9px] sm:text-[10px] font-extrabold uppercase tracking-widest text-[#ff3b00] block">INFORMASI LISENSI</span>
                            <div class="space-y-2 sm:space-y-2.5 text-xs text-slate-300 font-medium">
                                <div class="flex justify-between border-b border-white/10 pb-2">
                                    <span class="text-slate-400">Penerbit Resmi</span>
                                    <span class="font-bold text-white text-right">${escapeHtml(cert.issuer)}</span>
                                </div>
                                <div class="flex justify-between border-b border-white/10 pb-2">
                                    <span class="text-slate-400">Tahun Penerbitan</span>
                                    <span class="font-bold text-white text-right">${escapeHtml(cert.year)}</span>
                                </div>
                                ${cert.credentialId ? `
                                <div class="flex justify-between border-b border-white/10 pb-2">
                                    <span class="text-slate-400">ID Kredensial</span>
                                    <span class="font-bold text-[#ff3b00] text-right">${escapeHtml(cert.credentialId)}</span>
                                </div>
                                ` : ''}
                            </div>
                            <a href="index.html#contact" class="btn-pill-red w-full justify-center text-xs py-2.5 sm:py-3 font-bold mt-2 flex items-center gap-2">
                                <i class="fa-solid fa-shield-halved"></i> Verifikasi / Konsultasi Lisensi
                            </a>
                        </div>
                    </div>

                    <!-- Next & Prev Navigation -->
                    <div class="flex items-center justify-between border-t border-white/10 pt-6 sm:pt-8 gap-2 sm:gap-4">
                        ${prevCert ? `
                            <a href="detail.html?type=cert&id=${prevCert.id}" class="group flex items-center gap-2 sm:gap-3 text-slate-400 hover:text-white transition-all max-w-[48%]">
                                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-white/10 group-hover:bg-[#ff3b00] group-hover:text-white flex items-center justify-center text-xs shrink-0 transition-all">
                                    <i class="fa-solid fa-arrow-left"></i>
                                </div>
                                <div class="overflow-hidden">
                                    <span class="text-[8px] sm:text-[9px] font-extrabold uppercase tracking-widest text-slate-500 block truncate">SERTIFIKAT SEBELUMNYA</span>
                                    <span class="text-[10px] sm:text-xs font-bold text-slate-200 truncate block">${escapeHtml(prevCert.title)}</span>
                                </div>
                            </a>
                        ` : `<div></div>`}

                        ${nextCert ? `
                            <a href="detail.html?type=cert&id=${nextCert.id}" class="group flex items-center gap-2 sm:gap-3 text-slate-400 hover:text-white transition-all text-right max-w-[48%] ml-auto">
                                <div class="overflow-hidden">
                                    <span class="text-[8px] sm:text-[9px] font-extrabold uppercase tracking-widest text-slate-500 block truncate">SERTIFIKAT SELANJUTNYA</span>
                                    <span class="text-[10px] sm:text-xs font-bold text-slate-200 truncate block">${escapeHtml(nextCert.title)}</span>
                                </div>
                                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl sm:rounded-2xl bg-white/10 group-hover:bg-[#ff3b00] group-hover:text-white flex items-center justify-center text-xs shrink-0 transition-all">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </div>
                            </a>
                        ` : `<div></div>`}
                    </div>
                `;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
        });
    </script>
</body>

</html>
